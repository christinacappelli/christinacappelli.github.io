<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Christina Cappelli · Design</title>
		<meta name="description" content="Design work by Christina Cappelli" />
		<link rel="stylesheet" href="./style.css" />
		<script>
			(function () {
				try {
					var saved = localStorage.getItem("theme");
					var theme =
						saved ||
						(window.matchMedia("(prefers-color-scheme: dark)").matches
							? "dark"
							: "light");
					document.documentElement.setAttribute("data-theme", theme);
				} catch (e) {
					document.documentElement.setAttribute("data-theme", "light");
				}
			})();
		</script>
		<script src="./script.js" defer></script>
	</head>

	<body>
		<header class="site-header" role="banner">
			<div class="container">
				<div class="header-brand">
					<h1 class="site-title"><a href="index.html">Christina Cappelli</a></h1>
					<p class="site-tagline">
						<a href="index.html">Technologist</a> |
						<a href="production.html">Producer</a> |
						<a href="design.html" class="is-active" style="color: red;">Designer</a>
					</p>
				</div>
				<button
					type="button"
					class="theme-toggle"
					aria-label="Toggle light and dark mode"
					title="Toggle theme"
				>
					<svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
						<path d="M21 14.5A8.5 8.5 0 0 1 9.5 3 7 7 0 1 0 21 14.5z"></path>
					</svg>
					<svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
						<circle cx="12" cy="12" r="4"></circle>
						<path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
					</svg>
				</button>
			</div>
		</header>

		<!-- MAIN DESIGN PROJECTS SECTION -->
		<main id="design" class="projects-section" role="main" style="margin-bottom: 0.5rem; padding-top: 2rem;">
			<div class="container">
				<!-- SECTION HEADING. -->
				<h2 style="text-align: center; margin-bottom: 1.25rem; font-weight: 300;">Select Design Work</h2>
				<!-- <p style="text-align: center; color: var(--muted); margin-bottom: 1.25rem; max-width: 600px; margin-left: auto; margin-right: auto;">
					Creative designer with a passion for crafting visually compelling and user-centric designs. Below are some samples.
				</p> -->

				<!-- PROJECTS GRID -->
				<div class="projects-grid">
					<!-- Placeholder for design projects -->
					<article class="project-card">
						<div class="thumb" aria-hidden="true" style="background-image: url('./thumbs/design-placeholder.jpg');"></div>
						<h3 class="project-title">Design Project 1</h3>
						<p class="project-desc">Description of the design project goes here.</p>
						<ul class="project-tags">
							<li>Graphic Design</li><li>UI/UX</li>
						</ul>
						<p class="project-client" style="font-size: 0.85rem; text-align: left;">Client: <span>Client Name</span></p>
					</article>
				</div>
			</div>
		</main>

		<!-- FOOTER -->
		<footer class="site-footer" role="contentinfo">
			<div class="container">
				<nav aria-label="Contact links">

						<li><a href="https://www.behance.net/christinacappelli" target="_blank" rel="noopener">Behance</a></li>
					</ul>
				</nav>
				<small class="copyright">© <span id="year"></span> Christina Cappelli</small>
			</div>
		</footer>

		<script>
			// Update footer year automatically
			document.getElementById('year').textContent = new Date().getFullYear();
		</script>
	</body>
</html>
